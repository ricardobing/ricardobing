<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Retriever comparison: lexical search won with nDCG@25 0.821 versus 0.747 for the baseline">
  <title>Retriever comparison — nDCG@25 over 113 queries</title>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="#ffffff" stroke="#d7deea"/>
  <text x="48" y="58" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1" fill="#7c3aed">MEASURED BEFORE DECIDING · 113 QUERIES · PAIRED BOOTSTRAP, 95% CI</text>
  <text x="48" y="100" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">I built a hybrid RAG. I switched on lexical search, because it won.</text>
  <text x="360" y="136" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#94a3b8">nDCG@25 (axis from 0.70)</text>
  <text x="48" y="170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">SQL + recency (baseline)</text>
  <rect x="360" y="150" width="700" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="360" y="150" width="219" height="28" rx="8" fill="#dbe3f0"/>
  <text x="591" y="170" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#0f172a">0.747</text>
  <text x="48" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Dense, truncated listing</text>
  <rect x="360" y="202" width="700" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="360" y="202" width="490" height="28" rx="8" fill="#dbe3f0"/>
  <text x="862" y="222" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#0f172a">0.805</text>
  <text x="48" y="274" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Dense, sentence chunks</text>
  <rect x="360" y="254" width="700" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="360" y="254" width="280" height="28" rx="8" fill="#dbe3f0"/>
  <text x="652" y="274" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#0f172a">0.760</text>
  <text x="48" y="326" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">Lexical (Spanish full-text)</text>
  <rect x="360" y="306" width="700" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="360" y="306" width="565" height="28" rx="8" fill="#047857"/>
  <text x="937" y="326" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#047857">0.821</text><rect x="995" y="308" width="118" height="24" rx="12" fill="#047857" fill-opacity="0.14"/><text x="1054" y="325" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#047857">SWITCHED ON</text>
  <text x="48" y="378" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Hybrid dense + lexical (RRF)</text>
  <rect x="360" y="358" width="700" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="360" y="358" width="378" height="28" rx="8" fill="#dbe3f0"/>
  <text x="750" y="378" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#0f172a">0.781</text>
  <text x="48" y="430" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Hybrid + cross-encoder reranker</text>
  <rect x="360" y="410" width="700" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="360" y="410" width="420" height="28" rx="8" fill="#dbe3f0"/>
  <text x="792" y="430" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#0f172a">0.790</text>
  <rect x="48" y="470" width="356" height="58" rx="10" fill="#f1f5f9" stroke="#d7deea"/>
  <text x="64" y="494" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#047857">Lexical: 21.7% of candidates discarded in curation</text>
  <text x="64" y="514" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569">vs 29.2% for the baseline</text>
  <rect x="420" y="470" width="356" height="58" rx="10" fill="#f1f5f9" stroke="#d7deea"/>
  <text x="436" y="494" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Reranker: +0.009 nDCG (noise)</text>
  <text x="436" y="514" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569">for 30 extra seconds per report</text>
  <rect x="792" y="470" width="356" height="58" rx="10" fill="#f1f5f9" stroke="#d7deea"/>
  <text x="808" y="494" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Dense retrieval and reranker:</text>
  <text x="808" y="514" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569">built, measured, switched off</text>
</svg>
